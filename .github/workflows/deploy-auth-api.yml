name: Deploy auth-api to Cloudflare
on:
  workflow_dispatch:
  push:
    branches: [selfhost-v0.74]
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 456abb679c28a57e56665f5873199240
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: 1.4.2 }
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - run: bun install --frozen-lockfile
      - name: Build
        working-directory: apps/auth-api
        run: bun run build
      - name: Deploy (only when CLOUDFLARE_API_TOKEN secret exists)
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' }}
        working-directory: apps/auth-api
        run: bunx wrangler deploy && bunx wrangler d1 migrations apply openbot-auth --remote
      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: auth-api-build
          include-hidden-files: true
          retention-days: 7
          path: |
            apps/auth-api/dist
            apps/auth-api/.wrangler/deploy
